# haseen drop-in for dms.service (installed by: haseen layer apply dms).
# DMS and the haseen shell both claim org.freedesktop.Notifications, the
# polkit agent and the session lock, so only one of them may run. Switch
# explicitly with: haseen shell use dms|haseen
[Unit]
Conflicts=haseen-shell.service
# Conflicts= alone does not order the stop before the start; any ordering
# dependency does, so the bus name is free before dms.service claims it.
After=haseen-shell.service
