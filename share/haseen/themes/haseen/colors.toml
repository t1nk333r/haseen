# haseen: haseen's own theme and the default for new installs. It derives
# from HANCORE's Greek Noir (MIT, see LICENSE and UPSTREAM.md) as the owner
# runs it on luna, with the "akane" active-border wipe (border_wipe below). `mode`
# added by haseen (luminance gives the same answer); every colour is
# byte-identical to luna's copy.
mode = "dark"

# Accent and UI colors
accent = "#F25623"
active_border_color = "#88A57D"
active_tab_background = "#F25623"

# The active border's clockwise wipe (plan 069): the gradient that turns, and
# the seconds one turn takes. hyprland.lua reads both. Up to 10 s a turn,
# Hyprland's borderangle animation draws it; slower than that (Hyprland's
# speed stops at 100 ds), haseen-sidecar turns the angle instead.
border_wipe = "rgba(F25623ff) rgba(F25623cc) rgba(F2562311) rgba(F25623cc)"
border_wipe_seconds = 36

# Cursor colors
cursor = "#aeab94"

# Primary colors
foreground = "#CCD0CF"
background = "#171717"

# Selection colors
selection_foreground = "#171717"
selection_background = "#F56E0F"

# Normal colors (ANSI 0-7)
color0 = "#171717"
color1 = "#aeab94"
color2 = "#F25623"
color3 = "#757864"
color4 = "#88A57D"
color5 = "#F56E0F"
color6 = "#7b837b"
color7 = "#a6ada6"

# Bright colors (ANSI 8-15)
color8 = "#525252"
color9 = "#aeab94"
color10 = "#F25623"
color11 = "#757864"
color12 = "#88A57D"
color13 = "#F56E0F"
color14 = "#7b837b"
color15 = "#bcbfbc"
