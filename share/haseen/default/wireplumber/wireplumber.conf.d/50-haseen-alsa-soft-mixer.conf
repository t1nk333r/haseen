## Software volume control for every ALSA device.
##
## Adapted from Omarchy default/wireplumber/wireplumber.conf.d/alsa-soft-mixer.conf
## (MIT, Copyright (c) David Heinemeier Hansson).
##
## This avoids hardware mixer quirks (muffled audio on some Realtek codecs) and
## gives the same volume behaviour on every machine. A speaker tuning needs it
## for a second reason: the tuning's limiter is calibrated for a fixed gain
## structure, and a hardware mixer moves the operating point of the codec's
## smart amplifier underneath it.
##
## `haseen audio tuning apply` seeds this into
## ~/.config/wireplumber/wireplumber.conf.d/ and never overwrites it afterwards;
## `haseen audio tuning remove` leaves it in place, because it is not part of
## any one tuning.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
