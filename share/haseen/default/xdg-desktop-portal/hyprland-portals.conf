# ~/.config/xdg-desktop-portal/hyprland-portals.conf — your portal backends
# under Hyprland. Seeded once by `haseen seed user`; haseen never rewrites it.
# Reference: man portals.conf
#
# xdg-desktop-portal reads only the first of these files it finds, so this one
# repeats Hyprland's own list (hyprland, then gtk) and adds the keyring:
# without it no backend serves the Secret portal, and a Flatpak app cannot
# store its passwords in gnome-keyring. Adapted from Omarchy
# config/xdg-desktop-portal/hyprland-portals.conf (MIT, Copyright (c) David
# Heinemeier Hansson).

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
