#? Config file for btop v.1.4
#
# Adapted from Omarchy config/btop/btop.conf (MIT, Copyright (c) David
# Heinemeier Hansson). Only the settings haseen has an opinion about are kept;
# btop fills in every other default itself and rewrites this file on exit.
#
# The colours are NOT here: `haseen theme set` renders
# share/haseen/themed/btop.theme.tpl into
# ~/.local/state/haseen/current/theme/btop.theme, and `haseen seed user` links
# that to ~/.config/btop/themes/current.theme, which is what "current" below
# resolves to. Changing color_theme opts out of the theme pipeline.
color_theme = "current"

#* Use the theme's background. Set to false for a transparent terminal.
theme_background = true
truecolor = true

#* h,j,k,l,g,G move in lists.
vim_keys = true
rounded_corners = true
graph_symbol = "braille"

shown_boxes = "cpu mem net proc"

#* haseen's resource rule: nothing polls faster than 2 s (docs/architecture.md §6).
update_ms = 2000

#* "cpu lazy" keeps the top of the list readable instead of flickering.
proc_sorting = "cpu lazy"
proc_colors = true
proc_gradient = true
proc_mem_bytes = true
proc_cpu_graphs = true

show_gpu_info = "Auto"
cpu_invert_lower = true
show_uptime = true
check_temp = true
show_coretemp = true
temp_scale = "celsius"
show_cpu_freq = true
clock_format = "%X"

mem_graphs = true
show_swap = true
swap_disk = true
show_disks = true
only_physical = true
use_fstab = true
show_io_stat = true

net_auto = true
net_sync = true

show_battery = true
selected_battery = "Auto"

log_level = "WARNING"
save_config_on_exit = true
