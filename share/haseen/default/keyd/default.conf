# Written by `haseen setup keyd` (/etc/keyd/default.conf).
# Hold CapsLock = hyper (Ctrl+Meta+Alt+Shift, i.e. SUPER + SHIFT + ALT + CTRL
# in Hyprland binds); tap CapsLock = Escape; hold RightAlt and press CapsLock =
# real CapsLock.
[ids]
*

[main]
capslock = overload(hyper, esc)

[hyper:C-M-A-S]

# keyd binds rightalt to its built-in altgr layer, so this is the CapsLock key
# pressed while RightAlt is held. `rightalt+capslock` in [main] would be a
# chord instead: both keys within keyd's 50 ms chord_timeout (plan 190).
[altgr]
capslock = capslock
