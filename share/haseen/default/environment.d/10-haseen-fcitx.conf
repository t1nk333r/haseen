# Adapted from Omarchy default/environment.d/10-omarchy-fcitx.conf (MIT,
# Copyright (c) David Heinemeier Hansson).
#
# Read by systemd --user at login, so every graphical app started from the
# session sees it. GTK is deliberately absent: GTK3/4 on Wayland use the
# compositor's text-input protocol, and setting GTK_IM_MODULE there breaks
# input in Electron and GTK4 apps.
INPUT_METHOD=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
SDL_IM_MODULE=fcitx
