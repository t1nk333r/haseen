<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- haseen Arabic script rules. Owned by haseen, never edited by the user;
     ~/.config/fontconfig/fonts.conf includes it after the theme's fonts.conf.

     Why this file exists: the Latin faces haseen ships (Inter, JetBrainsMono
     Nerd Font, 0xProto) carry no Arabic glyphs, so every Arabic run falls
     through to whatever fontconfig ranks next. Unpatched that is
     "Noto Nastaliq Urdu" — the sloping calligraphic Nastaliq style used for
     Urdu and Persian — which makes plain Arabic look Farsi. Modern Standard
     Arabic wants Naskh.

     These rules test `lang`, not `family`, so they still fire after the
     theme file has assigned a family list.

     Fonts: noto-fonts (base layer) ships Noto Sans Arabic, Noto Naskh Arabic
     and Noto Kufi Arabic. Noto Nastaliq Urdu comes from noto-fonts-extra,
     which haseen does not install; the Urdu rules below are no-ops without it. -->
<fontconfig>
  <!-- Urdu keeps Nastaliq, where it is the correct style. A language-specific
       preference outranks the generic Arabic-script fallback below. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ur</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Nastaliq Urdu</string>
    </edit>
  </match>

  <!-- Arabic content always has a Naskh face at the end of its family list. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Naskh Arabic</string>
    </edit>
  </match>

  <!-- Never let Nastaliq win for Arabic. fontconfig sorts candidates by, among
       other things, font version; zeroing it for this one face and this one
       language pushes it behind the Naskh and Sans faces without removing it. -->
  <match target="font">
    <test name="family"><string>Noto Nastaliq Urdu</string></test>
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="fontversion" mode="assign"><int>0</int></edit>
  </match>

  <!-- Arabic is read right to left and sits lower than Latin; hinting at the
       default (hintslight) keeps the joins intact. Stated rather than left to
       the distribution so a CachyOS fontconfig change cannot break shaping. -->
  <match target="font">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
