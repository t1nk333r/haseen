# haseen (base layer) -> /etc/systemd/system.conf.d/
# From Omarchy's 20-mount-events.conf in the same directory (60e96ac0d,
# #15182); MIT, Copyright (c) David Heinemeier Hansson. Skipped where
# Omarchy's own copy is installed (plan 104).
[Manager]
# The default five mount events per second can defer local filesystems and
# binfmt registration during boot. Raise the allowance to thirty events per
# second; this also permits more mount processing under sustained runtime load.
ManagerEnvironment=SYSTEMD_DEFAULT_MOUNT_RATE_LIMIT_BURST=30
