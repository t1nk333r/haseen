# ~/.config/foot/foot.ini — your foot config.
# Seeded once by `haseen layer apply desktop`; haseen never rewrites it.
# Reference: man foot.ini

[main]
font=JetBrainsMono Nerd Font:size=11
pad=8x8

# Colours of the current haseen theme, written by `haseen theme set`.
# Settings after this line override the theme.
include=~/.local/state/haseen/current/theme/foot.ini

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes
