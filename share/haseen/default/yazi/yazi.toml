# ~/.config/yazi/yazi.toml — your yazi config.
# Seeded once by `haseen seed user`; haseen never rewrites it.
#
# Derived from the owner's own config (waydots, his private dotfiles,
# relicensed MIT), with the
# parts that only exist on that machine removed: the personal helper scripts
# behind the openers, and the binds that need plugins installed by yazi's
# package manager. What is left runs on a stock `yazi` from extra.
#
# Colours are not here: ~/.config/yazi/theme.toml is a link into the theme
# pipeline's render, so `haseen theme set` repaints yazi like everything else.

[mgr]
ratio = [3, 4, 5]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
# Keep ten lines of context around the cursor instead of letting it ride the
# edge of the pane.
scrolloff = 10
mouse_events = ["click", "scroll", "drag"]
title_format = "Yazi: {cwd}"

[preview]
wrap = "no"
tab_size = 2
# foot is haseen's default terminal and yazi draws into it with sixels
# (yazi-adapter/src/drivers/drivers.rs: `Foot => [Sixel]`). Sixel is a
# palette format, so a larger preview costs quantisation time, not just
# bandwidth; these bounds are the owner's, measured on a 2256x1504 panel.
max_width = 700
max_height = 900
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# One dispatcher. On the desktop every file goes to haseen's default handler
# (`xdg-open`), so a PDF, an image or a video opens the same application here
# as it does from the launcher, the browser or a notification — yazi picks the
# file, it does not decide what owns the type.
#
# Over ssh/mosh there is no desktop to hand anything to, so each opener has a
# terminal form instead. The test is the ssh/mosh environment, not the
# absence of $DISPLAY: a forwarded X11 session would pass that and still open
# a window on the wrong machine.
open = [
  { run = 'if [ -n "${SSH_CONNECTION}${SSH_TTY}${MOSH_CONNECTION}${MOSH_IP}" ]; then exec "${EDITOR:-vi}" %s1; else xdg-open %s1; fi', desc = "Open", block = true, for = "linux" },
]
edit = [
  { run = 'if [ -n "${SSH_CONNECTION}${SSH_TTY}${MOSH_CONNECTION}${MOSH_IP}" ]; then exec "${EDITOR:-vi}" %s; else xdg-open %s1; fi', desc = "Edit", block = true, for = "linux" },
]
play = [
  { run = 'if [ -n "${SSH_CONNECTION}${SSH_TTY}${MOSH_CONNECTION}${MOSH_IP}" ]; then exec mpv --vo=tct %s; else xdg-open %s1; fi', desc = "Play", block = true, for = "linux" },
]
view = [
  { run = 'if [ -n "${SSH_CONNECTION}${SSH_TTY}${MOSH_CONNECTION}${MOSH_IP}" ]; then exec mpv --vo=tct %s; else xdg-open %s1; fi', desc = "View", block = true, for = "linux" },
]
document = [
  { run = 'if [ -n "${SSH_CONNECTION}${SSH_TTY}${MOSH_CONNECTION}${MOSH_IP}" ]; then pdftotext %s1 - | less; else xdg-open %s1; fi', desc = "Open document", block = true, for = "linux" },
]

[open]
# Only the types where the default rule would stay inside the terminal need a
# line here; everything else already falls through to `open`, which is
# xdg-open.
prepend_rules = [
  { mime = "image/*", use = ["view", "reveal"] },
  { mime = "application/pdf", use = ["document", "reveal"] },
  { url = "*.m3u", use = ["play", "edit", "reveal"] },
]

[tasks]
file_workers = 3
plugin_workers = 5
fetch_workers = 5
preload_workers = 2
process_workers = 5
bizarre_retry = 3
image_alloc = 536870912 # 512MB
image_bound = [10000, 10000]
suppress_preload = false

[input]
cursor_blink = false

cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

overwrite_title = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

quit_title = "Quit?"
quit_content = "The following task is still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
sort_translit = false
