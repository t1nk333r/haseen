# haseen's Tensaku defaults. Seeded once to ~/.config/tensaku/config.toml;
# after that the file is yours and haseen never touches it again (Tensaku's own
# Preferences dialog writes to it too).
#
# Tensaku is the annotation editor behind `haseen capture screenshot --edit`
# ([omarchy]/tensaku 0.29.0, a Satty fork that replaced Satty in Omarchy). It
# refuses a config with an unknown key or a wrong type and exits, so only keys
# of its 0.29.0 parser are used here (src/configuration.rs
# ConfigurationFileGeneral). Colours of the window chrome are not here: Tensaku
# reads ~/.config/tensaku/overrides.css for those, and the seed links that to
# the theme pipeline's render, so `haseen theme set` restyles the editor too.
#
# The annotation palette is not theme-derived: annotations are drawn on a
# picture of the themed screen, where theme-coloured arrows would be the one
# thing you cannot see. These are high-contrast marker colours instead.

[general]
# Enter copies and leaves; Escape leaves. One keystroke each, like ShareX.
# Tensaku's own default keeps the window open on Escape (close-on-esc false),
# so Escape is given the exit action. `haseen capture screenshot --edit` makes
# Enter save instead, so what it keeps, copies and uploads is what you
# annotated; Escape cancels the capture.
actions-on-enter = ["save-to-clipboard"]
actions-on-escape = ["exit"]
close-on-copy = true
close-on-save = true
copy-command = "wl-copy"
# The tool people reach for first on a screenshot is an arrow, not a brush.
initial-tool = "arrow"
corner-roundness = 12
# CTRL at the start of a highlight gives the freehand one.
primary-highlighter = "block"
# haseen already notifies from the capture command; a second toast is clutter.
disable-notifications = true
# Hyprland owns the decorations; asking for none keeps the editor a clean box.
no-window-decoration = true
floating-hack = true
# Smooths the brush without lagging it (upstream suggests 5-10).
brush-smooth-history-size = 8

[keybinds]
pointer = "p"
crop = "c"
brush = "b"
line = "i"
arrow = "z"
rectangle = "r"
ellipse = "e"
text = "t"
marker = "m"
blur = "u"
highlight = "g"
# Tensaku's default for spotlight is g, which highlight takes above.
spotlight = "s"

[font]
# The shell's UI font (desktop layer: inter-font), with the Arabic face the
# fontconfig rules pick and the emoji font as fallbacks. Tensaku has no fallback
# chain of its own beyond this list.
family = "Inter"
style = "Regular"
fallback = ["Noto Naskh Arabic", "Noto Color Emoji"]

[color-palette]
# 1-9/0 select these in order.
palette = [
    "#eb4d4bff", # red
    "#f0932bff", # orange
    "#f9ca24ff", # yellow
    "#6ab04cff", # green
    "#22a6b3ff", # cyan
    "#4834d4ff", # blue
    "#ffffffff", # white
    "#000000ff", # black
]
custom = []
