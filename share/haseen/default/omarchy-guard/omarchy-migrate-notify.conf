# haseen drop-in for Omarchy's omarchy-migrate-notify.service (plan 101),
# installed with haseen's tree as
# PREFIX/lib/systemd/user/omarchy-migrate-notify.service.d/haseen.conf.
# The unit's absolute ExecStart (/usr/bin/omarchy-migrate-notify) bypasses
# haseen's answer to that name; its inner `omarchy-migrate --pending` reaches
# haseen's ledger, so it showed a second, Omarchy-branded "pending
# migrations" notice beside haseen-migrate-notify.service. Omarchy's own
# migrations are sealed (haseen migrate omarchy), so it has nothing to say.
[Unit]
Description=Omarchy's pending-migration notice (silenced: haseen-migrate-notify.service answers it)

[Service]
ExecStart=
ExecStart=/usr/bin/true
