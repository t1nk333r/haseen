# haseen CI: the same gates AGENTS.md asks for before every commit and push.
#   lint    tools/lint.sh (bash -n, shellcheck, luac, jq, qmllint)
#   test    on a pull request, tests/run.sh --affected: only the tests its
#           changes affect (tools/affected-tests.sh, plan 100); on a push to
#           main, the full tests/run.sh, so anything the mapping misses fails
#           there; as a normal user (haseen refuses to run as root); rust is
#           in ARCH_PACKAGES for wootingd's cargo tests (plan 099)
#   docs    tools/check-docs.sh (needs full history: plans cite commits)
#   secrets gitleaks over every commit + tools/secrets.sh privacy patterns
# Lint and tests run in an Arch container, the distro haseen targets, so
# shellcheck, Qt 6 and the other tools match what an Arch/CachyOS host has.
# Third-party actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request cancels its older run. A running suite on
  # main is never cancelled: each merge's full run is the safety net for pull
  # requests that ran only their affected tests (plan 100). GitHub keeps one
  # pending run per group and cancels an older pending one, so of several
  # merges queued behind a running suite the newest still gets a full run,
  # and it carries every earlier merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ARCH_PACKAGES: >-
    git bash jq lua shellcheck curl file python nodejs qt6-declarative
    imagemagick qrencode zbar foot which diffutils quickshell go socat
    python-dbus python-gobject rust

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: |
          read -ra pkgs <<<"$ARCH_PACKAGES"
          pacman -Syu --noconfirm --needed "${pkgs[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the checkout
        # actions/checkout trusts the workspace only in its own step's
        # temporary git config. The steps after it run as root on a checkout
        # another uid owns, and git refuses that ("dubious ownership", PR #56's
        # run 39647712605); tools/lint.sh runs git through
        # tools/affected-tests.sh --check.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Versions
        run: |
          bash --version | head -1
          shellcheck --version | sed -n 2p
          /usr/lib/qt6/bin/qmllint --version
      - name: tools/lint.sh
        run: tools/lint.sh

  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    # The suite took 85-88 minutes here by 2026-10-21 and plan 099's cargo
    # build pushed main's run past the old 90-minute limit (run 39613979814,
    # cancelled at 90 min, nothing failed). 150 leaves room to grow; a future
    # deadlock must still fail this job instead of consuming hours.
    timeout-minutes: 150
    steps:
      - name: Tools
        run: |
          read -ra pkgs <<<"$ARCH_PACKAGES"
          pacman -Syu --noconfirm --needed "${pkgs[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge base must be in the clone (plan 100).
          fetch-depth: 0
      - name: Unprivileged user
        # The tests, and the git in tests/run.sh --affected, run as ci, who owns
        # the checkout after this: git needs no safe.directory here.
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
      - name: tests/run.sh
        # A pull request runs the tests its changes affect, measured from the
        # event's base commit to the checked-out head; a push to main and a
        # manual run run the full suite. An empty selection passes, so the
        # required check reports on a docs-only pull request too. runuser
        # keeps the working directory (the checkout).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
              args=(--affected --committed "$BASE_SHA")
          fi
          runuser -u ci -- env QT_QPA_PLATFORM=offscreen HASEEN_REQUIRE_ENGINE=1 HOME=/home/ci tests/run.sh "${args[@]}"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tools/check-docs.sh
        run: tools/check-docs.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -fsSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: tools/secrets.sh
        env:
          GITLEAKS: /tmp/gitleaks
        run: tools/secrets.sh
